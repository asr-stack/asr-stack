<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Pixel cat jumping over a cactus. Hi, I'm Asra" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .st { fill:#ffffff; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100% {opacity:.15} 50% {opacity:1} }
  .cactus { animation: run 4s linear infinite; }
  @keyframes run { from { transform: translateX(1250px) } to { transform: translateX(-120px) } }
  .ground { animation: scroll .889s linear infinite; }
  @keyframes scroll { from { transform: translateX(0) } to { transform: translateX(-300px) } }
  .cat { animation: jump 4s infinite; }
  @keyframes jump {
    0%,68% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.3,1) }
    75% { transform: translateY(-95px); animation-timing-function: linear }
    78% { transform: translateY(-95px); animation-timing-function: cubic-bezier(.7,0,.8,.3) }
    86%,100% { transform: translateY(0) }
  }
  .fa { animation: fa .3s steps(1) infinite; }
  .fb { animation: fb .3s steps(1) infinite; }
  @keyframes fa { 0% {opacity:1} 50% {opacity:0} }
  @keyframes fb { 0% {opacity:0} 50% {opacity:1} }
  .tail { transform-origin: 0px 18px; animation: wag 1.2s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-8deg) } }
  .t { font-family: 'Courier New', Courier, monospace; }
</style>
