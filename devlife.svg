<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Animated terminal: git commit messages getting worse, sudo make me a sandwich, and a cat saying it works on my machine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
.c0 { transform-box: fill-box; transform-origin: 100% 50%; animation: k0 18.0s infinite; }
@keyframes k0 {
  0%,3.33% { transform: scaleX(1); animation-timing-function: steps(27); }
  11.11%,96% { transform: scaleX(0); }
  96.5%,100% { transform: scaleX(1); }
}
.c1 { transform-box: fill-box; transform-origin: 100% 50%; animation: k1 18.0s infinite; }
@keyframes k1 {
  0%,14.44% { transform: scaleX(1); animation-timing-function: steps(31); }
  23.33%,96% { transform: scaleX(0); }
  96.5%,100% { transform: scaleX(1); }
}
.c2 { transform-box: fill-box; transform-origin: 100% 50%; animation: k2 18.0s infinite; }
@keyframes k2 {
  0%,26.67% { transform: scaleX(1); animation-timing-function: steps(29); }
  34.44%,96% { transform: scaleX(0); }
  96.5%,100% { transform: scaleX(1); }
}
.c3 { transform-box: fill-box; transform-origin: 100% 50%; animation: k3 18.0s infinite; }
@keyframes k3 {
  0%,37.78% { transform: scaleX(1); animation-timing-function: steps(42); }
  50.0%,96% { transform: scaleX(0); }
  96.5%,100% { transform: scaleX(1); }
}
.c4 { transform-box: fill-box; transform-origin: 100% 50%; animation: k4 18.0s infinite; }
@keyframes k4 {
  0%,53.33% { transform: scaleX(1); animation-timing-function: steps(25); }
  63.33%,96% { transform: scaleX(0); }
  96.5%,100% { transform: scaleX(1); }
}
.okay { opacity:0; animation: a_okay 18.0s infinite; }
@keyframes a_okay {
  0%,65.56% { opacity:0 }
  65.61%,96% { opacity:1 }
  96.5%,100% { opacity:0 }
}
.cat { opacity:0; animation: a_cat 18.0s infinite; }
@keyframes a_cat {
  0%,70.0% { opacity:0 }
  70.06%,96% { opacity:1 }
  96.5%,100% { opacity:0 }
}
.say { opacity:0; animation: a_say 18.0s infinite; }
@keyframes a_say {
  0%,74.44% { opacity:0 }
  74.5%,96% { opacity:1 }
  96.5%,100% { opacity:0 }
}
.prompt { opacity:0; animation: a_prompt 18.0s infinite; }
@keyframes a_prompt {
  0%,66.67% { opacity:0 }
  66.72%,96% { opacity:1 }
  96.5%,100% { opacity:0 }
}
.open { animation: op 3.2s infinite; }
.shut { animation: sh 3.2s infinite; }
@keyframes op { 0%,90% {opacity:1} 91%,96% {opacity:0} 97%,100% {opacity:1} }
@keyframes sh { 0%,90% {opacity:0} 91%,96% {opacity:1} 97%,100% {opacity:0} }
.cur { animation: bl 1s steps(1) infinite; }
@keyframes bl { 0%,50% {opacity:1} 51%,100% {opacity:0} }
.tw { animation: tw 2s ease-in-out infinite; }
@keyframes tw { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
</style>
<rect width="900" height="340" rx="12" fill="#161b22" stroke="#30363d"/>
<path d="M0 12a12 12 0 0 1 12-12h876a12 12 0 0 1 12 12v28H0z" fill="#21262d"/>
<circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="48" cy="20" r="6" fill="#ffbd2e"/><circle cx="70" cy="20" r="6" fill="#27c93f"/>
<text x="450" y="25" text-anchor="middle" font-size="14" fill="#8b949e">asra@dev: ~/life</text>
<text x="30" y="100" font-size="18" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">git commit -m </tspan><tspan fill="#f778ba">"fixed bug"</tspan></text>
<rect class="cv c0" x="30" y="80" width="305.0" height="28" fill="#161b22"/>
<text x="30" y="135" font-size="18" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">git commit -m </tspan><tspan fill="#f778ba">"fixed the fix"</tspan></text>
<rect class="cv c1" x="30" y="115" width="349.0" height="28" fill="#161b22"/>
<text x="30" y="170" font-size="18" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">git commit -m </tspan><tspan fill="#f778ba">"please work"</tspan></text>
<rect class="cv c2" x="30" y="150" width="327.0" height="28" fill="#161b22"/>
<text x="30" y="205" font-size="18" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">git commit -m </tspan><tspan fill="#f778ba">"it works, don't touch it"</tspan></text>
<rect class="cv c3" x="30" y="185" width="470.0" height="28" fill="#161b22"/>
<text x="30" y="240" font-size="18" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">sudo make me a sandwich</tspan></text>
<rect class="cv c4" x="30" y="220" width="283.0" height="28" fill="#161b22"/>
<text class="okay" x="30" y="275" font-size="18" fill="#3fb950">Okay.</text>
<g class="prompt"><text x="30" y="310" font-size="18" fill="#3fb950">$ </text><rect class="cur" x="52" y="294" width="10" height="20" fill="#e6edf3"/></g>
<g class="cat"><g class="tw">
  <text x="620" y="115" font-size="22" fill="#f778ba" xml:space="preserve"> /\_/\</text>
  <g class="open"><text x="620" y="141" font-size="22" fill="#f778ba" xml:space="preserve">( o.o )</text></g>
  <g class="shut"><text x="620" y="141" font-size="22" fill="#f778ba" xml:space="preserve">( -.- )</text></g>
  <text x="620" y="167" font-size="22" fill="#f778ba" xml:space="preserve"> &gt; ^ &lt;</text>
</g></g>
<text class="say" x="560" y="215" font-size="17" fill="#9da7b3" font-style="italic">"It works on my machine."</text>
</svg>